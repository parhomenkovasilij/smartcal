name: SmartCal CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # потрібно для створення релізу

jobs:
  author:
    name: Інформація про автора
    runs-on: ubuntu-latest
    steps:
      - name: Вивід інформації про автора
        run: |
          echo "Проєкт: SmartCal — розумний календар-планувальник"
          echo "Автор: Пархоменко Василь, група КВ-41"
          echo "Автор коміту: ${{ github.event.head_commit.author.name }}"
          echo "Повідомлення коміту: ${{ github.event.head_commit.message }}"
          echo "Коміт: ${{ github.sha }}"

  build:
    name: Тести та збирання
    needs: author
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановлення PyInstaller
        run: pip install pyinstaller

      - name: Модульні тести
        run: python -m unittest -v

      - name: Збирання виконуваного файлу
        run: pyinstaller --onefile --windowed --name SmartCal main.py

      - uses: actions/upload-artifact@v4
        with:
          name: SmartCal-windows
          path: dist/SmartCal.exe

  release:
    name: Публікація релізу
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SmartCal-windows

      - name: Створення релізу на GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SmartCal v1.0.${{ github.run_number }}
          body: |
            Автоматична збірка з коміту ${{ github.sha }}.
            Автор: Пархоменко Василь, КВ-41.
          files: SmartCal.exe
